; PlatformIO project for the T-Beam V1.2 (AXP2101) hardware self-test.
;
; Build:   pio run -d firmware/tbeam-selftest
; Upload:  pio run -d firmware/tbeam-selftest -t upload --upload-port /dev/ttyUSB0
; Monitor: pio device monitor -p /dev/ttyUSB0 -b 115200
;
; Standalone project: it has its own setup()/loop(), so it cannot share the
; tag's src_dir. Needs no config.h — every value is defined in the sketch.

[platformio]
src_dir = .

[env:tbeam]
platform = espressif32
board = ttgo-t-beam
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
	-D T_BEAM_SX1276
	-DCORE_DEBUG_LEVEL=0

lib_deps =
	jgromes/RadioLib
	lewisxhe/XPowersLib
	mikalhart/TinyGPSPlus
	olikraus/U8g2

; Same firmware, but dumps raw NMEA instead of parsed fields. Use to diagnose a
; receiver that streams bytes but never resolves a fix.
[env:nmea]
extends = env:tbeam
build_flags =
	${env:tbeam.build_flags}
	-DECHO_RAW_NMEA=1
