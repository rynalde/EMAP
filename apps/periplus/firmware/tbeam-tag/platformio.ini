; PlatformIO project for the T-Beam GPS LoRa tag.
;
; Build:  pio run          -e tbeam
; Upload: pio run -t upload -e tbeam --upload-port /dev/ttyACM0
; Serial: pio device monitor
;
; Requires config.h (gitignored):  cp config.example.h config.h
;
; The sketch stays as tbeam-tag.ino next to config.h, so src_dir points at the
; project root instead of the usual src/ layout. This keeps the Arduino IDE and
; arduino-cli workflows in the README working unchanged.
;
; ONE IMAGE FOR EVERY TAG. There are no per-board environments: each board
; derives its own tag_id at boot from its factory-programmed efuse MAC, so the
; identical binary can be flashed to any number of tags and they stay uniquely
; identifiable.

[platformio]
src_dir = .

[env:tbeam]
platform = espressif32
board = ttgo-t-beam
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; XPowersLib and U8g2 are pulled in behind `#if __has_include(...)`, which the
; default chain-mode dependency finder does not evaluate. deep+ runs the
; preprocessor so the optional PMU and OLED support are actually compiled in.
lib_ldf_mode = deep+

lib_deps =
	jgromes/RadioLib
	mikalhart/TinyGPSPlus
	lewisxhe/XPowersLib
	olikraus/U8g2

build_flags =
	-DCORE_DEBUG_LEVEL=0
