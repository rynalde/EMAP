; PlatformIO project for the T-Echo USB serial gateway.
;
; Build:   pio run -d firmware/techo-gateway
; Monitor: pio device monitor -b 115200
;
; Requires config.h (gitignored):  cp config.example.h config.h
;
; Board choice: PlatformIO has no dedicated T-Echo board, and none is needed.
; LilyGO's own T-Echo repo targets nrf52840_dk_adafruit, whose Adafruit-BSP
; variant maps Arduino pin N straight onto P0.N. That is exactly the raw port
; numbering config.example.h uses (LORA_CS 24 -> P0.24, BUSY 17 -> P0.17, ...),
; so the documented pin table applies unchanged. The board's own factory
; firmware reports itself as "nRF52840 DK", confirming the same target.
; Ref: https://github.com/Xinyuan-LilyGO/T-Echo/blob/main/platformio.ini
;
; As with the tag, src_dir points at the project root so the .ino stays put and
; the Arduino IDE workflow in the README keeps working.
;
; TWO UPLOAD ENVIRONMENTS — the nRF52 changes USB identity between application
; mode (239a:80da) and bootloader mode (239a:002a). Over USB/IP that matters,
; because each identity must be bound separately:
;
;   env:techo      1200-baud touch reboots the board into DFU automatically.
;                  Use once BOTH identities are bound and usbipd is running
;                  with --auto-attach, so the re-enumeration survives.
;
;   env:techo-dfu  No touch. Use when the board is ALREADY sitting in DFU
;                  (double-click reset), which is the reliable path the first
;                  time, since a manually-entered bootloader waits indefinitely
;                  instead of timing out.

[platformio]
src_dir = .

[techo_base]
platform = nordicnrf52
board = nrf52840_dk_adafruit
framework = arduino

monitor_speed = 115200

; The T-Echo ships the Adafruit nRF52 bootloader and flashes over serial DFU.
upload_protocol = nrfutil

lib_deps =
	jgromes/RadioLib
	mikalhart/TinyGPSPlus
	zinggjm/GxEPD2
	adafruit/Adafruit GFX Library

[env:techo]
extends = techo_base
; Adds the 1200-baud touch that reboots the board into DFU automatically. See
; the script for why upload_flags cannot express this.
extra_scripts = post:dfu_touch.py

[env:techo-dfu]
extends = techo_base
