; PlatformIO project for the T-SIM7000G cellular GPS tag.
;
; Build:  pio run          -e tsim7000g
; Upload: pio run -t upload -e tsim7000g --upload-port /dev/ttyUSB0
; Serial: pio device monitor
;
; Requires config.h (gitignored):  cp config.example.h config.h
;
; The sketch stays next to config.h, so src_dir points at the project root
; instead of the usual src/ layout — same as the other firmware here, and it
; keeps the Arduino IDE workflow in the README working unchanged.
;
; NOT one image for every tag, unlike the LoRa tags. This board holds an ingest
; key, and a key is per device: two boards sharing one would be one device as
; far as the database is concerned. Build once per board with its own config.h.

[platformio]
src_dir = .

[env:tsim7000g]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
	vshymanskyy/TinyGSM
	arduino-libraries/ArduinoHttpClient

build_flags =
	-DCORE_DEBUG_LEVEL=0
