#
# xiao-cs-gateway — CS Initiator + RAS client.
#
# Derived from nrf/samples/bluetooth/channel_sounding/ras_initiator/prj.conf.
# Deviations from that file are commented; everything else is the sample's
# tested configuration and is deliberately left alone.
#

CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="LoRaMVP CS Gateway"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_BONDABLE=n

# The Ranging Profile recommends a MTU of at least 247 octets.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y

CONFIG_BT_RAS_MODE_3_SUPPORTED=n
CONFIG_BT_RAS_MAX_ANTENNA_PATHS=1
CONFIG_BT_CS_DE_MAX_NUM_ANTENNA_PATHS=1
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=1
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=1
CONFIG_BT_CTLR_SDC_CS_STEP_MODE3=n

# Disabling the CS Test command reduces flash usage
CONFIG_BT_CTLR_CHANNEL_SOUNDING_TEST=n

# This allows CS and ACL to use different PHYs
CONFIG_BT_TRANSMIT_POWER_CONTROL=y

CONFIG_BT_AUTO_PHY_UPDATE=n

CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_RAS=y
CONFIG_BT_RAS_RREQ=y
CONFIG_BT_CS_DE=y

# Distance estimation and the median filter need floating point in printf.
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y

# --- deviations from the sample ---

# The sample uses the bt_scan helper with a UUID filter. This gateway parses
# advertising data directly instead, because it has to read the tag's UID out
# of the manufacturer-specific field to know *which* tag it is looking at
# before deciding whether to connect.
CONFIG_BT_SCAN=n

# The sample prints results through the logging subsystem. The bridge needs
# exactly one JSON object per line on stdout, so printk goes straight to the
# console while logs stay on the same UART prefixed with '[' — the same split
# the T-Echo gateway uses.
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Logs must not interleave with a JSON line mid-emit, or the bridge sees a
# truncated object and drops a real observation.
CONFIG_LOG_MODE_MINIMAL=y
