#
# xiao-cs-tag — CS Reflector + RAS server.
#
# Derived from nrf/samples/bluetooth/channel_sounding/ras_reflector/prj.conf.
# Deviations from that file are commented; everything else is the sample's
# tested configuration and is deliberately left alone.
#

CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_DK_LIBRARY=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="LoRaMVP CS Tag"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_BONDABLE=n

# The Ranging Profile recommends a MTU of at least 247 octets.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y

# This reduces RAM usage. Additional RAM is needed to support optional
# features such as mode 3 or multiantenna.
CONFIG_BT_RAS_MODE_3_SUPPORTED=n
CONFIG_BT_RAS_MAX_ANTENNA_PATHS=1
# The sample also sets CONFIG_BT_CS_DE_MAX_NUM_ANTENNA_PATHS here. It is
# dropped: distance estimation runs on the initiator, so BT_CS_DE is n on a
# reflector and the assignment is inert — it only produces a build warning.
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=1
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=1
CONFIG_BT_CTLR_SDC_CS_STEP_MODE3=n
CONFIG_BT_CTLR_SDC_CS_ROLE_REFLECTOR_ONLY=y

# Disabling the CS Test command reduces flash usage
CONFIG_BT_CTLR_CHANNEL_SOUNDING_TEST=n

# This allows CS and ACL to use different PHYs
CONFIG_BT_TRANSMIT_POWER_CONTROL=y

# Let the initiating device control the PHY updates
CONFIG_BT_AUTO_PHY_UPDATE=n

CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_RAS=y
CONFIG_BT_RAS_RRSP=y

# --- deviations from the sample ---

# Reads FICR.DEVICEID for the tag's fixed UID. Not in the sample, which has no
# identity of its own.
CONFIG_HWINFO=y

# Power note: CONFIG_PM is deliberately NOT set. Zephyr silently drops it on
# this target (HAS_PM is not satisfied for nRF54L15 here), so setting it would
# claim a power behaviour the build does not actually have.
#
# What genuinely governs idle cost on this tag is the advertising interval,
# which is the tag's only radio activity between ranging sessions — see
# TAG_ADV_INTERVAL_MIN/MAX in src/main.c. The kernel is tickless by default, so
# the CPU is already in a low-power state between advertising events.
